name: Full Stack Application Deployment Test

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  COMPOSE_PROJECT_NAME: myapp

jobs:
  deploy-and-test:
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create .env file from secrets
        run: |
          {
            echo "DB_HOST=${{ secrets.DB_HOST }}"
            echo "DB_PORT=${{ secrets.DB_PORT }}"
            echo "DB_NAME=${{ secrets.DB_NAME }}"
            echo "DB_USER=${{ secrets.DB_USER }}"
            echo "DB_PASSWORD=${{ secrets.DB_PASSWORD }}"
            echo "APP_PORT=${{ secrets.APP_PORT }}"
            echo "APP_SECRET=${{ secrets.APP_SECRET }}"
            echo "API_KEY=${{ secrets.API_KEY }}"
            echo "COMPOSE_PROJECT_NAME=${{ env.COMPOSE_PROJECT_NAME }}"
          } > .env
          echo ".env created"
          sed 's/=.*/=***/' .env

      - name: Deploy with Docker Compose
        run: |
          docker compose down -v || true
          docker compose up -d --build
          docker compose ps

      - name: Deploy with Docker Compose
        run: |
          echo "=== Очистка старых контейнеров и томов ==="
          docker compose down -v || true
          
          echo "=== Проверка файла .env перед запуском ==="
          sed 's/DB_PASSWORD=.*/DB_PASSWORD=***HIDDEN***/' .env
          
          echo "=== Проверка того, как Docker Compose видит переменные ==="
          docker compose config
          
          echo "=== Запуск контейнеров ==="
          docker compose up -d --build
          
          echo "=== Ожидание запуска ==="
          sleep 20
          docker compose ps
          docker compose logs

      - name: Run application tests
        run: |
          set -e
          echo "Waiting for application..."
          for i in $(seq 1 30); do
            if curl -fsS "http://localhost:${{ secrets.APP_PORT }}/health" >/dev/null; then
              break
            fi
            sleep 2
          done

          echo "1. Testing application and database connectivity..."
          curl -fsS "http://localhost:${{ secrets.APP_PORT }}/health"
          curl -fsS "http://localhost:${{ secrets.APP_PORT }}/api/data"

          echo "2. Testing data consistency..."
          DB_COUNT=$(docker compose exec -T db psql \
            -U "${{ secrets.DB_USER }}" \
            -d "${{ secrets.DB_NAME }}" \
            -t -A -c "SELECT COUNT(*) FROM items;")
          WEB_COUNT=$(curl -fsS "http://localhost:${{ secrets.APP_PORT }}/api/items/count" | tr -dc '0-9')

          echo "DB_COUNT=$DB_COUNT" >> test-results.env
          echo "WEB_COUNT=$WEB_COUNT" >> test-results.env

          echo "Database count: $DB_COUNT"
          echo "Web API count: $WEB_COUNT"

          test "$DB_COUNT" = "$WEB_COUNT"
          echo "Data consistency test passed"

      - name: Create test report
        if: always()
        run: |
          source test-results.env 2>/dev/null || true
          cat > test-report.md <<EOF
          # Deployment Test Report

          - Date: $(date)
          - Application health: checked
          - Database connectivity: checked
          - DB_COUNT: ${DB_COUNT:-unknown}
          - WEB_COUNT: ${WEB_COUNT:-unknown}
          - Containers: checked with docker compose ps

          ## Environment
          - DB_HOST: ${{ secrets.DB_HOST }}
          - DB_NAME: ${{ secrets.DB_NAME }}
          - APP_PORT: ${{ secrets.APP_PORT }}
          EOF

      - name: Save Docker logs
        if: always()
        run: |
          docker compose logs > deployment-logs.txt || true
          docker images > docker-images.txt || true
          docker ps -a > docker-ps.txt || true

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deployment-artifacts
          path: |
            .env
            test-report.md
            test-results.env
            deployment-logs.txt
            docker-images.txt
            docker-ps.txt
          retention-days: 30